<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Fruit Cutter</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        overflow:hidden;
    }

    body{
        background:#000;
        font-family:Arial, sans-serif;
    }

    video{
        position:absolute;
        width:100vw;
        height:100vh;
        object-fit:cover;
        transform:scaleX(-1);
        z-index:1;
    }

    canvas{
        position:absolute;
        top:0;
        left:0;
        z-index:2;
    }

    #score{
        position:absolute;
        top:15px;
        left:15px;
        z-index:5;
        color:white;
        font-size:32px;
        font-weight:bold;
        text-shadow:0 0 10px black;
    }
</style>
</head>
<body>

<div id="score">Score: 0</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let finger = null;
let previousFinger = null;

class Fruit{
    constructor(){
        this.radius = 35 + Math.random()*15;

        this.x = Math.random()*canvas.width;
        this.y = canvas.height + this.radius;

        this.vx = (Math.random()-0.5)*6;
        this.vy = -(12 + Math.random()*8);

        const fruits=['🍎','🍉','🍊','🍋','🍓'];
        this.emoji = fruits[Math.floor(Math.random()*fruits.length)];

        this.sliced=false;
    }

    update(){
        this.x += this.vx;
        this.y += this.vy;

        this.vy += 0.25;
    }

    draw(){
        ctx.font = `${this.radius*1.8}px Arial`;
        ctx.textAlign="center";
        ctx.fillText(this.emoji,this.x,this.y);
    }
}

let fruits=[];

function spawnFruit(){
    fruits.push(new Fruit());
}

setInterval(()=>{
    spawnFruit();
},900);

function distance(x1,y1,x2,y2){
    return Math.sqrt((x2-x1)**2 + (y2-y1)**2);
}

function lineIntersectsCircle(x1,y1,x2,y2,cx,cy,r){

    let dx=x2-x1;
    let dy=y2-y1;

    let l2=dx*dx+dy*dy;

    if(l2===0) return false;

    let t=((cx-x1)*dx+(cy-y1)*dy)/l2;
    t=Math.max(0,Math.min(1,t));

    let px=x1+t*dx;
    let py=y1+t*dy;

    return distance(px,py,cx,cy)<=r;
}

function gameLoop(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(previousFinger && finger){

        ctx.strokeStyle='cyan';
        ctx.lineWidth=8;
        ctx.beginPath();
        ctx.moveTo(previousFinger.x,previousFinger.y);
        ctx.lineTo(finger.x,finger.y);
        ctx.stroke();
    }

    for(let i=fruits.length-1;i>=0;i--){

        let fruit=fruits[i];

        fruit.update();
        fruit.draw();

        if(
           finger &&
           previousFinger &&
           lineIntersectsCircle(
               previousFinger.x,
               previousFinger.y,
               finger.x,
               finger.y,
               fruit.x,
               fruit.y,
               fruit.radius
           )
        ){
            fruits.splice(i,1);
            score++;
            document.getElementById("score").innerText =
            "Score: "+score;
            continue;
        }

        if(fruit.y > canvas.height+100){
            fruits.splice(i,1);
        }
    }

    requestAnimationFrame(gameLoop);
}

/* Camera */

navigator.mediaDevices.getUserMedia({
    video:{
        facingMode:"user"
    }
})
.then(stream=>{
    video.srcObject = stream;
});

/* MediaPipe Hands */

const hands = new Hands({
    locateFile:(file)=>{
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
});

hands.setOptions({
    maxNumHands:1,
    modelComplexity:1,
    minDetectionConfidence:0.7,
    minTrackingConfidence:0.7
});

hands.onResults(results=>{

    previousFinger = finger;

    if(results.multiHandLandmarks &&
       results.multiHandLandmarks.length > 0){

        const hand = results.multiHandLandmarks[0];

        const tip = hand[8];

        finger = {
            x:(1-tip.x)*canvas.width,
            y:tip.y*canvas.height
        };

        ctx.beginPath();
        ctx.arc(finger.x,finger.y,12,0,Math.PI*2);
        ctx.fillStyle="yellow";
        ctx.fill();
    }
    else{
        finger=null;
    }
});

const camera = new Camera(video,{
    onFrame: async ()=>{
        await hands.send({image:video});
    },
    width:1280,
    height:720
});

camera.start();

gameLoop();

window.addEventListener('resize',()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});
</script>

</body>
</html>
